# Full native suite. Only applications listed below are scheduled.
# matrix_file retains the runner's schema name but contains absolute CSR binary paths.
runs: 10

supported_load_balances:
  - thread_mapped
  - block_mapped
  - merge_path
  - merge_path_v2

graphs:
  soc-orkut:
    matrix_file: /data-8/Graph-Datasets/bin/bfs-gen/soc-orkut.bin
    vertices: 2997166
    csr_edges: 212698418
  roadNet-CA:
    matrix_file: /data-8/Graph-Datasets/bin/bfs-gen/roadNet-CA.bin
    vertices: 1971281
    csr_edges: 5533214
  indochina-2004:
    matrix_file: /data-8/Graph-Datasets/bin/bfs-gen/indochina-2004.bin
    vertices: 7414866
    csr_edges: 194109311
  hollywood-2009:
    matrix_file: /data-8/Graph-Datasets/bin/bfs-gen/hollywood-2009.bin
    vertices: 1139905
    csr_edges: 115031232

# YAML anchors share the repeated case and argument structures below.
shared:
  one_process: &one_process runs_in_one_process
  advance_lb_flag: &advance_lb_flag --advance_load_balance
  selected_source_cases: &selected_source_cases
    - graph: soc-orkut
      source: [0]
    - graph: roadNet-CA
      source: [0]
    - graph: indochina-2004
      source: [0]
  source_args: &source_args
    - --binary-in
    - "{matrix}"
    - --src
    - "{source}"
    - --num_runs
    - "{runs}"
    - --export_metrics
    - --json_dir
    - "{output_dir}"
    - --json_file
    - native.json
  pr_args: &pr_args
    - --binary-in
    - "{matrix}"
    - --num_runs
    - "{runs}"
    - --export_metrics
    - --json_dir
    - "{output_dir}"
    - --json_file
    - native.json

applications:
  bfs:
    repeat_mode: *one_process
    load_balance:
      flag: *advance_lb_flag
      policy: thread_mapped
    args: *source_args
    cases: *selected_source_cases

  sssp:
    repeat_mode: *one_process
    load_balance:
      flag: *advance_lb_flag
      policy: merge_path_v2
    args: *source_args
    cases: *selected_source_cases

  bc:
    repeat_mode: *one_process
    load_balance:
      effective: merge_path_v2 (hard-coded in algorithm)
    args: *source_args
    cases: *selected_source_cases

  pr:
    repeat_mode: *one_process
    load_balance:
      effective: not applicable (edge parallel_for)
    args: *pr_args
    cases: *selected_source_cases

  tc:
    repeat_mode: fresh_processes
    load_balance:
      flag: *advance_lb_flag
      policy: block_mapped
    args:
      - --binary-in
      - "{matrix}"
      - --reduce
      - "{reduce}"
    cases:
      - graph: hollywood-2009
        source: [0]
        reduce_all_triangles: true
