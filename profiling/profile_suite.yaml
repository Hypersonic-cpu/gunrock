# Single-run copy of the native suite for profiler captures.
# Each selected application/graph is launched once by the profiler.
runs: 1
# Binary names are derived from graph matrix_file stems by replacing .mtx with .bin.
binary_root: /data-8/Graph-Datasets/bin/bfs-gen

gpu_metrics:
  metric_set: ga10x-gfxt
  frequencies_hz: [10000, 50000, 100000, 200000]

supported_load_balances:
  - thread_mapped
  - block_mapped
  - merge_path
  - merge_path_v2

graphs:
  soc-orkut:
    matrix_file: soc-orkut.mtx
    vertices: 2997166
    csr_edges: 212698418
  roadNet-CA:
    matrix_file: roadNet-CA.mtx
    vertices: 1971281
    csr_edges: 5533214
  indochina-2004:
    matrix_file: indochina-2004.mtx
    vertices: 7414866
    csr_edges: 194109311
  hollywood-2009:
    matrix_file: hollywood-2009.mtx
    vertices: 1139905
    csr_edges: 115031232

# YAML anchors share the repeated case and argument structures below.
shared:
  advance_lb_flag: &advance_lb_flag --advance_load_balance
  selected_source_cases: &selected_source_cases
    - graph: soc-orkut
      source: [0]
    - graph: roadNet-CA
      source: [0]
    - graph: indochina-2004
      source: [0]
  source_args: &source_args
    - --binary-in
    - "{binary}"
    - --src
    - "{source}"
    - --num_runs
    - "{runs}"
    - --export_metrics
    - --json_dir
    - "{output_dir}"
    - --json_file
    - native.json
  pr_args: &pr_args
    - --binary-in
    - "{binary}"
    - --num_runs
    - "{runs}"
    - --export_metrics
    - --json_dir
    - "{output_dir}"
    - --json_file
    - native.json

applications:
  bfs:
    load_balance:
      flag: *advance_lb_flag
      policy: thread_mapped
    args: *source_args
    cases: *selected_source_cases

  sssp:
    load_balance:
      flag: *advance_lb_flag
      policy: merge_path_v2
    args: *source_args
    cases: *selected_source_cases

  bc:
    load_balance:
      effective: merge_path_v2 (hard-coded in algorithm)
    args: *source_args
    cases: *selected_source_cases

  pr:
    load_balance:
      effective: not applicable (edge parallel_for)
    args: *pr_args
    cases: *selected_source_cases

  tc:
    load_balance:
      flag: *advance_lb_flag
      policy: block_mapped
    args:
      - --binary-in
      - "{binary}"
      - --reduce
      - "{reduce}"
    cases:
      - graph: hollywood-2009
        source: [0]
        reduce_all_triangles: true
