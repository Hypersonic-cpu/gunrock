# TC-only native suite. Omitting other applications omits them from the run.
runs: 3

supported_load_balances:
  - thread_mapped
  - block_mapped
  - merge_path
  - merge_path_v2

graphs:
  hollywood-2009:
    matrix_file: hollywood-2009.mtx
    vertices: 1139905
    csr_edges: 113891327

shared:
  advance_lb_flag: &advance_lb_flag --advance_load_balance

applications:
  tc:
    repeat_mode: fresh_processes
    load_balance:
      flag: *advance_lb_flag
      policy: block_mapped
    args:
      - --market
      - "{matrix}"
      - --reduce
      - "{reduce}"
    cases:
      - graph: hollywood-2009
        source: 0
        reduce_all_triangles: true
